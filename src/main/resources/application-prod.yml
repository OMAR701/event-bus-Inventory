
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:5432/inventory_prod?currentSchema=prod&sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      leak-detection-threshold: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    schemas: prod
    validate-on-migrate: true
    locations: classpath:db/migration/prod

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
server:
  port: 8080